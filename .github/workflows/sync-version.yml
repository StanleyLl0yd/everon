name: Sync Everon 2.8.1 README version

on:
  push:
    branches:
      - release-2.8.1-publish
    paths:
      - .github/workflows/sync-version.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release-2.8.1-publish
      - name: Sync README versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('README.md', 'README.ru.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              updated = text.replace('2.8.0', '2.8.1', 1)
              if updated == text:
                  raise SystemExit(f'{name}: source version marker not found')
              path.write_text(updated, encoding='utf-8')
          PY
          rm .github/workflows/sync-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ru.md .github/workflows/sync-version.yml
          git commit -m "Sync Everon 2.8.1 documentation version"
          git push origin HEAD:release-2.8.1-publish
