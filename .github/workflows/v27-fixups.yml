name: v2.7 fixups

on:
  push:
    paths:
      - ".github/workflows/v27-fixups.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - shell: python
        run: |
          from pathlib import Path

          app = Path("src/App.cpp")
          text = app.read_text(encoding="utf-8")
          old = """            timer.ResumeMonotonicDuration();
          }
      }
  
      m_settings.SetTimerConfig(timer);"""
          new = """            timer.ResumeMonotonicDuration();
              m_settings.SetTimerRuntimeDeadline(timer.monotonicDeadlineMs);
          }
      }
  
      m_settings.SetTimerConfig(timer);"""
          if old not in text:
              raise SystemExit("App.cpp fixup target not found")
          app.write_text(text.replace(old, new), encoding="utf-8")

          loc = Path("src/Localization.cpp")
          text = loc.read_text(encoding="utf-8")
          old = "por another application."
          if old not in text:
              raise SystemExit("Localization fixup target not found")
          loc.write_text(text.replace(old, "por otra aplicación."), encoding="utf-8")
      - run: git diff --check
      - run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add src/App.cpp src/Localization.cpp
          git commit -m "Polish v2.7 runtime state"
          git push origin HEAD:codex/v2.7
