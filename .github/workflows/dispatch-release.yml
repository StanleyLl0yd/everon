name: Dispatch Everon v2.8.1 release

on:
  push:
    branches:
      - dispatch-v2.8.1
    paths:
      - .github/workflows/dispatch-release.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dispatch-v2.8.1
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" -f ref=main
          rm .github/workflows/dispatch-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dispatch-release.yml
          git commit -m "Remove temporary release dispatcher"
          git push origin HEAD:dispatch-v2.8.1
