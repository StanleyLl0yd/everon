name: Publish v2.7

on:
  push:
    paths:
      - ".github/workflows/publish-v2.7.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: 7880b1ce4da5d37c6d580e3a4fc74768b7d6c813
          fetch-depth: 0

      - name: Verify version
        shell: pwsh
        run: |
          $versionHeader = Get-Content "src/Version.h" -Raw
          if ($versionHeader -notmatch '#define VER_MAJOR 2' -or
              $versionHeader -notmatch '#define VER_MINOR 7' -or
              $versionHeader -notmatch '#define VER_PATCH 0') {
            throw "src/Version.h does not declare version 2.7.0"
          }

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/Release/Everon.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Everon.exe" | Set-Content "build/Release/Everon.exe.sha256" -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Create tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = "7880b1ce4da5d37c6d580e3a4fc74768b7d6c813"
          $existing = gh api repos/${{ github.repository }}/git/ref/tags/v2.7 2>$null
          if ($LASTEXITCODE -eq 0) {
            $ref = $existing | ConvertFrom-Json
            if ($ref.object.sha -ne $target) {
              throw "Existing v2.7 tag points to $($ref.object.sha), expected $target"
            }
          } else {
            gh api --method POST repos/${{ github.repository }}/git/refs -f ref='refs/tags/v2.7' -f sha=$target
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.7 *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v2.7 already exists"
          }

          $notes = @'
          ## Everon 2.7

          ### Added
          - Quick tray timers for 15 minutes, 30 minutes, 1 hour, and 2 hours.
          - Localized Tomorrow indicator for next-day Until time selections.
          - Automatic retry and a single warning when Windows temporarily rejects the requested power state.

          ### Changed
          - Duration timers use a monotonic clock while Everon is running, with persisted UTC recovery after restart.
          - Power-state bookkeeping changes only after SetThreadExecutionState succeeds.
          - Expanded timer regression coverage.
          - Removed obsolete localization entries.
          '@

          $notes | Set-Content release-notes.md -Encoding utf8
          gh release create v2.7 `
            "build/Release/Everon.exe" `
            "build/Release/Everon.exe.sha256" `
            --verify-tag `
            --title "Everon v2.7" `
            --notes-file release-notes.md

      - name: Verify release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/${{ github.repository }}/releases/tags/v2.7 | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) {
            throw "v2.7 must be a stable published release"
          }
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names -notcontains "Everon.exe" -or $names -notcontains "Everon.exe.sha256") {
            throw "Release assets are incomplete"
          }
