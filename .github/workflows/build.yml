name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version metadata
        shell: pwsh
        run: ./scripts/verify-version.ps1

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/Release/Everon.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Everon.exe" | Set-Content "build/Release/Everon.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Everon-x64
          path: |
            build/Release/Everon.exe
            build/Release/Everon.exe.sha256
          if-no-files-found: error
