name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version metadata
        shell: pwsh
        run: ./scripts/verify-version.ps1

      - name: Configure
        run: cmake -S . -B build -A x64 -T v143 -DBUILD_TESTING=ON -DEVERON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/Release/Everon.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Everon.exe" | Set-Content "build/Release/Everon.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Everon-x64
          path: |
            build/Release/Everon.exe
            build/Release/Everon.exe.sha256
          if-no-files-found: error

      - name: Require SonarCloud quality gate
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $deadline = (Get-Date).AddMinutes(4)
          do {
            $checks = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:SONAR_SHA/check-runs?per_page=100" `
              -Headers $headers
            $sonar = $checks.check_runs |
              Where-Object { $_.name -eq "SonarCloud Code Analysis" } |
              Select-Object -First 1
            if ($sonar -and $sonar.status -eq "completed") {
              if ($sonar.conclusion -ne "success") {
                throw "SonarCloud quality gate concluded '$($sonar.conclusion)'"
              }
              Write-Host "SonarCloud quality gate passed"
              exit 0
            }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          throw "Timed out waiting for SonarCloud quality gate"
