name: Clean up stale development branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --delete \
            codex/harden-v2.5.1 \
            codex/prepare-v2.5 \
            codex/publish-v2.5.1 \
            codex/readme-accuracy \
            codex/release-v2.5 \
            codex/ui-v2.6 \
            codex/update-readme-files-with-license-details \
            docs/password-generator-style
