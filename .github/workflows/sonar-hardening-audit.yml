name: Sonar hardening audit

on:
  push:
    branches:
      - hardening-cpp20

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List open PR issues
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=StanleyLl0yd_everon' \
            --data-urlencode 'pullRequest=21' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100' \
            | jq '{total, issues: [.issues[] | {rule,severity,type,component,line,message,impacts}]}'
