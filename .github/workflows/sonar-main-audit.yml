name: Sonar main audit

on:
  push:
    branches:
      - codex/sonar-audit

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List Sonar main issues
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=StanleyLl0yd_everon' \
            --data-urlencode 'branch=main' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=500' \
            | jq -r '.issues[] | [.rule, .severity, (.component | sub("StanleyLl0yd_everon:"; "")), (.line // 0), .message] | @tsv'
