name: Sonar PR audit

on:
  push:
    branches:
      - sonar-main-cleanup

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: List remaining PR issues
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=StanleyLl0yd_everon' \
            --data-urlencode 'pullRequest=22' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=500' \
            | jq '{total, issues: [.issues[] | {rule,severity,component,line,message,impacts}]}'
