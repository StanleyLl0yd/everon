name: Sonar PR diagnostics

on:
  push:
    branches:
      - codex/audit-fixes

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Sonar security findings'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sonar findings
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=StanleyLl0yd_everon' \
            --data-urlencode 'pullRequest=15' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100' \
            | jq '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message, impacts}]}'
