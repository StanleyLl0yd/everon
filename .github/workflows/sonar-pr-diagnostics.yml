name: Apply Sonar fixes

on:
  push:
    branches:
      - codex/audit-fixes

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run staged Sonar fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/audit-fixes
          fetch-depth: 0

      - name: Apply fixes
        run: python scripts/fix-sonar-pr.py

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add src/App.cpp src/Settings.cpp src/TrayIcon.cpp src/Version.h
          git commit -m "Resolve Sonar reliability findings"
          git push origin HEAD:codex/audit-fixes
