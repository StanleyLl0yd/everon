name: Apply audit hardening

on:
  push:
    branches:
      - codex/audit-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run audit hardening without workflow push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/audit-fixes
          fetch-depth: 0

      - name: Apply prepared patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/apply-audit-fixes.yml")
          text = source.read_text(encoding="utf-8")
          marker = "      - name: Apply fixes\n        shell: python\n        run: |\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n      - name: Verify changes", start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, str(source), "exec"), {"__name__": "__main__"})

      - name: Verify prepared patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'statusKnown' src/PowerPolicy.h
          grep -q 'ErrorTimerState' src/Localization.h
          test -f scripts/verify-version.ps1
          test -f .github/dependabot.yml

      - name: Commit non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add CMakeLists.txt README.md README.ru.md src tests scripts .github/dependabot.yml
          git commit -m "Apply repository audit hardening"
          git push origin HEAD:codex/audit-fixes
