name: Sonar PR17 diagnostics

on:
  push:
    branches:
      - codex/security-hotspots

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect PR17 Sonar issues'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sonar PR issues
        run: |
          curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=StanleyLl0yd_everon' \
            --data-urlencode 'pullRequest=17' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100' \
            | jq '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message, impacts}]}'
