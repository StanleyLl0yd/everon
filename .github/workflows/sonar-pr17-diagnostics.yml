name: Apply PR17 Sonar cleanup

on:
  push:
    branches:
      - codex/security-hotspots

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run PR17 Sonar cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/security-hotspots
          fetch-depth: 0
      - name: Apply cleanup
        run: python scripts/fix-pr17-sonar.py
      - name: Commit source change
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add src/Settings.cpp
          git commit -m "Clean up registry string write"
          git push origin HEAD:codex/security-hotspots
