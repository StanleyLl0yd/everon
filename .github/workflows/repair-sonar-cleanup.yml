name: Repair Sonar cleanup

on:
  push:
    branches:
      - sonar-main-cleanup

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: sonar-main-cleanup

      - name: Normalize localization references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*'):
                  if path.suffix not in {'.cpp', '.h'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  fixed = re.sub(
                      r'(?:const\s+)+auto&\s+loc\s*=\s*Localization::Instance\(\);',
                      'const auto& loc = Localization::Instance();',
                      text,
                  )
                  if fixed != text:
                      path.write_text(fixed, encoding='utf-8', newline='\n')
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Normalize localization references"
          git push origin HEAD:sonar-main-cleanup
