name: Align Everon repository description

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-repo-description.yml

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Align Everon repository description'
    runs-on: ubuntu-latest
    steps:
      - name: Update repository description
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PATCH repos/$GITHUB_REPOSITORY
          -f description='Everon is a lightweight native Windows tray utility that prevents automatic system sleep. Optional display keep-awake, F15/F16/F17 input, timer modes, global hotkey, autostart, notifications, and six UI languages.'
