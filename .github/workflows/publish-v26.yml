name: Publish Everon v2.6 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v26.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish Everon v2.6 release'
    runs-on: windows-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: 70d73f71e380513d595f917d8363a523782b1070
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify version and tag target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $text = Get-Content 'src/Version.h' -Raw
          if ($text -notmatch '#define\s+VER_MAJOR\s+2' -or
              $text -notmatch '#define\s+VER_MINOR\s+6' -or
              $text -notmatch '#define\s+VER_PATCH\s+0') {
            throw 'Version.h is not v2.6.0'
          }

          $ref = gh api repos/$env:GITHUB_REPOSITORY/git/ref/tags/v2.6 | ConvertFrom-Json
          if ($ref.object.type -ne 'commit' -or $ref.object.sha -ne '70d73f71e380513d595f917d8363a523782b1070') {
            throw "v2.6 tag does not point to the expected release commit"
          }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'build/Release/Everon.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Everon.exe" | Set-Content 'build/Release/Everon.exe.sha256' -Encoding ascii
          "EXE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare release notes
        shell: pwsh
        run: |
          $raw = Get-Content 'CHANGELOG.md' -Raw
          $match = [regex]::Match($raw, '(?ms)^## 2\.6\.0\b.*?(?=^## |\z)')
          if (-not $match.Success) {
            throw 'No changelog section found for v2.6.0'
          }
          $match.Value.Trim() | Set-Content 'release-notes.md' -Encoding utf8

      - name: Publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.6 --repo "$env:GITHUB_REPOSITORY" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release v2.6 already exists; refusing to overwrite it.'
          }

          gh release create v2.6 `
            'build/Release/Everon.exe' `
            'build/Release/Everon.exe.sha256' `
            --repo "$env:GITHUB_REPOSITORY" `
            --verify-tag `
            --title 'Everon v2.6' `
            --notes-file 'release-notes.md'

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to publish Everon v2.6'
          }

          Write-Host "Published Everon v2.6 SHA-256: $env:EXE_SHA256"
