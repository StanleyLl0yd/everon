name: Apply canonical Everon icon

on:
  push:
    branches:
      - feature/macos-universal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ICON_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-9d94-8243-b732-8619fc8a0888/raw?se=2026-09-18T11%3A50%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=965a93bb-8baf-5e23-baa7-2c457c1aca79&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A41%3A26Z&ske=2026-09-19T06%3A41%3A26Z&sks=b&skv=2026-02-06&sig=kG7wFrdho2Fl6jjzC0L%2BCwa6GlyP3XuLj59jlyh0EtQ%3D'
      ICON_SHA256: '0614908b53f8d4c7b2990857d82535580f7b8edabfd473c50e26e78eb8018fdd'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/macos-universal
          fetch-depth: 0

      - name: Download exact source artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets macos/resources
          curl --fail --location --retry 3 --output assets/Everon.png "$ICON_URL"
          echo "$ICON_SHA256  assets/Everon.png" | sha256sum --check -

      - name: Generate platform raster derivatives
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input Pillow==12.3.0
          python - <<'PY'
          from PIL import Image

          source = Image.open("assets/Everon.png")
          if source.size != (1254, 1254):
              raise SystemExit(f"unexpected source size: {source.size}")
          if source.mode != "RGBA":
              raise SystemExit(f"unexpected source mode: {source.mode}")

          source.save(
              "src/Everon.ico",
              format="ICO",
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          source.save(
              "macos/resources/Everon.icns",
              format="ICNS",
              sizes=[(16, 16), (32, 32), (64, 64), (128, 128), (256, 256), (512, 512), (1024, 1024)],
          )
          PY

      - name: Record exact asset hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum assets/Everon.png src/Everon.ico macos/resources/Everon.icns > assets/icon-manifest.sha256

      - name: Commit canonical artwork and derivatives
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-canonical-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply canonical Everon icon"
          git push origin HEAD:feature/macos-universal
