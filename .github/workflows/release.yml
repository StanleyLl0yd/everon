name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      exe_sha256: ${{ steps.hash.outputs.exe_sha256 }}

    steps:
      - name: Verify manual source
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "${{ github.event.repository.default_branch }}") {
            throw "Manual releases must be dispatched from the default branch"
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release
        id: resolve
        shell: pwsh
        run: |
          function Read-Define([string]$name) {
            $match = Select-String -Path "src/Version.h" -Pattern "^#define\s+$name\s+(\d+)" | Select-Object -First 1
            if (-not $match) {
              throw "Unable to read $name from src/Version.h"
            }
            return $match.Matches[0].Groups[1].Value
          }

          $major = Read-Define "VER_MAJOR"
          $minor = Read-Define "VER_MINOR"
          $patch = Read-Define "VER_PATCH"

          if ($patch -eq "0") {
            $version = "$major.$minor"
          } else {
            $version = "$major.$minor.$patch"
          }

          $tag = "v$version"
          $target = (git rev-parse HEAD).Trim()

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match Version.h ($tag)"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_sha=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure release is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $response = Invoke-WebRequest `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" `
            -Headers $headers `
            -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            throw "Release $env:TAG already exists. Bump the version before publishing another release."
          }
          if ($response.StatusCode -ne 404) {
            throw "Unexpected GitHub API status while checking release: $($response.StatusCode)"
          }

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate SHA-256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/Release/Everon.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Everon.exe" | Set-Content "build/Release/Everon.exe.sha256" -Encoding ascii
          "exe_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare release notes
        shell: pwsh
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $raw = Get-Content "CHANGELOG.md" -Raw
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match($raw, "(?ms)^## $escapedVersion\b.*?(?=^## |\z)")
          if (-not $match.Success) {
            throw "No changelog section found for version $version"
          }
          $match.Value.Trim() | Set-Content "release-notes.md" -Encoding utf8

      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          path: |
            build/Release/Everon.exe
            build/Release/Everon.exe.sha256
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      TARGET_SHA: ${{ needs.build.outputs.target_sha }}
      EXE_SHA256: ${{ needs.build.outputs.exe_sha256 }}

    steps:
      - name: Download release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload
          path: release

      - name: Ensure release tag
        shell: bash
        run: |
          set -euo pipefail
          if ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null); then
            ref_type=$(jq -r '.object.type' <<<"$ref_json")
            ref_sha=$(jq -r '.object.sha' <<<"$ref_json")
            if [[ "$ref_type" != "commit" || "$ref_sha" != "$TARGET_SHA" ]]; then
              echo "Tag $TAG does not point to the verified release commit $TARGET_SHA" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$TARGET_SHA" >/dev/null
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG appeared while the workflow was running" >&2
            exit 1
          fi

          gh release create "$TAG" \
            "release/build/Release/Everon.exe" \
            "release/build/Release/Everon.exe.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Everon $TAG" \
            --notes-file "release/release-notes.md"

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          [[ "$(jq -r '.object.type' <<<"$tag_json")" == "commit" ]]
          [[ "$(jq -r '.object.sha' <<<"$tag_json")" == "$TARGET_SHA" ]]

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          [[ "$(jq -r '.draft' <<<"$release_json")" == "false" ]]
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == "false" ]]

          exe_digest=$(jq -r '.assets[] | select(.name == "Everon.exe") | .digest // empty' <<<"$release_json")
          checksum_count=$(jq '[.assets[] | select(.name == "Everon.exe.sha256")] | length' <<<"$release_json")
          [[ -n "$exe_digest" ]]
          [[ "$checksum_count" == "1" ]]
          [[ "$exe_digest" == "sha256:$EXE_SHA256" ]]
