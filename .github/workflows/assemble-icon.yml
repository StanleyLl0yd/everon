name: Assemble Everon 2.8.1 icon

on:
  push:
    branches:
      - release-2.8.1-final
    paths:
      - .github/icon-staging/**
      - .github/workflows/assemble-icon.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release-2.8.1-final
      - name: Assemble raster icon assets
        shell: bash
        run: |
          set -euo pipefail
          cat .github/icon-staging/png_* > "$RUNNER_TEMP/Everon.png.b64"
          base64 --decode "$RUNNER_TEMP/Everon.png.b64" > src/Everon.png
          echo "894636960f4c110803e3e3de5527ebb6566bcf3d3187d97387466489f59beff8  src/Everon.png" | sha256sum --check --strict
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          img = Image.open('src/Everon.png').convert('RGBA')
          img.save('src/Everon.ico', format='ICO', sizes=[(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)])
          PY
          test -s src/Everon.ico
          file src/Everon.ico
          sha256sum src/Everon.png src/Everon.ico
          rm -rf .github/icon-staging
          rm .github/workflows/assemble-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Everon.png src/Everon.ico .github
          git commit -m "Apply Everon 2.8.1 icon"
          git push origin HEAD:release-2.8.1-final
