name: Everon v2.6 UI migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-v26-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Retry Everon v2.6 UI migration after About fix'
    runs-on: windows-latest

    steps:
      - name: Checkout v2.6 branch
        uses: actions/checkout@v5
        with:
          ref: codex/ui-v2.6
          fetch-depth: 0

      - name: Fetch migration script
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api "repos/$env:GITHUB_REPOSITORY/contents/.github/scripts/ui_v26_migrate.py?ref=main" | ConvertFrom-Json
          $base64 = $json.content -replace '\s',''
          [IO.File]::WriteAllBytes('ui_v26_migrate.py', [Convert]::FromBase64String($base64))

      - name: Apply migration
        run: python ui_v26_migrate.py

      - name: Repair generated About block
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('src/App.cpp')
          s = p.read_text(encoding='utf-8-sig')
          start = s.index('void App::ShowAbout() {')
          end = s.index('\nvoid App::OnTaskbarCreated()', start)
          replacement = r'''void App::ShowAbout() {
              auto& loc = Localization::Instance();
              wchar_t message[768];
              swprintf_s(message, _countof(message),
                        L"%s\n%s\n\nStanley Lloyd\n%s\n\nhttps://github.com/StanleyLl0yd/everon",
                        loc.GetString(StringID::AboutVersion),
                        loc.GetString(StringID::AboutTagline),
                        loc.GetString(StringID::AboutLicense));

              MessageBoxW(m_window, message,
                         loc.GetString(StringID::MenuAbout),
                         MB_OK | MB_ICONINFORMATION);
          }
          '''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8', newline='\n')
          '@ | python -

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Commit v2.6 changes
        shell: pwsh
        run: |
          Remove-Item ui_v26_migrate.py
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add CMakeLists.txt README.md README.ru.md CHANGELOG.md CHANGELOG.ru.md src/App.cpp src/SettingsDialog.cpp src/SettingsDialog.h src/TrayIcon.cpp src/TrayIcon.h src/Version.h src/app.rc
          git diff --cached --check
          git commit -m "Refresh Everon UI and UX for v2.6"
          git push origin HEAD:codex/ui-v2.6
