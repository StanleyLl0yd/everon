name: Everon v2.6 UI migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-v26-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run Everon v2.6 UI migration'
    runs-on: windows-latest

    steps:
      - name: Checkout v2.6 branch
        uses: actions/checkout@v5
        with:
          ref: codex/ui-v2.6
          fetch-depth: 0

      - name: Fetch migration script
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$env:GITHUB_REPOSITORY/contents/.github/scripts/ui_v26_migrate.py?ref=main --jq .content |
            ForEach-Object { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($_ -replace '\s',''))) } |
            Set-Content ui_v26_migrate.py -Encoding utf8

      - name: Apply migration
        run: python ui_v26_migrate.py

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Commit v2.6 changes
        shell: pwsh
        run: |
          Remove-Item ui_v26_migrate.py
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add CMakeLists.txt README.md README.ru.md CHANGELOG.md CHANGELOG.ru.md src/App.cpp src/SettingsDialog.cpp src/SettingsDialog.h src/TrayIcon.cpp src/TrayIcon.h src/Version.h src/app.rc
          git diff --cached --check
          git commit -m "Refresh Everon UI and UX for v2.6"
          git push origin HEAD:codex/ui-v2.6
