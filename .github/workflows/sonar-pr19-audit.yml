name: Sonar PR19 audit

on:
  push:
    branches:
      - codex/sonar-cleanup

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect PR19 Sonar findings'
    runs-on: ubuntu-latest
    steps:
      - name: List open PR issues
        shell: bash
        run: |
          curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=StanleyLl0yd_everon' \
            --data-urlencode 'pullRequest=19' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100' \
            | jq '{total, issues: [.issues[] | {key,rule,severity,type,component,line,message,impacts}]}'
