name: Remove redundant test Windows includes

on:
  push:
    branches:
      - sonar-main-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: sonar-main-cleanup

      - name: Remove redundant includes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('SettingsTests.cpp', 'SingleInstanceTests.cpp', 'TimerModeTests.cpp'):
              path = Path('tests') / name
              text = path.read_text(encoding='utf-8')
              text = text.replace('#include <windows.h>\n', '', 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Remove redundant Windows test includes"
          git push origin HEAD:sonar-main-cleanup
