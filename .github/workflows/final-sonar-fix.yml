name: Final Sonar fix

on:
  push:
    branches:
      - sonar-main-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: sonar-main-cleanup

      - name: Make dialog instance const-correct
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/SettingsDialog.cpp')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    SettingsDialog* instance = nullptr;', '    const SettingsDialog* instance = nullptr;')
          text = text.replace('instance = std::bit_cast<SettingsDialog*>(lParam);', 'instance = std::bit_cast<const SettingsDialog*>(lParam);')
          text = text.replace('instance = std::bit_cast<SettingsDialog*>(GetWindowLongPtrW(dialog, GWLP_USERDATA));',
                              'instance = std::bit_cast<const SettingsDialog*>(GetWindowLongPtrW(dialog, GWLP_USERDATA));')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git rm -f .github/workflows/final-sonar-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SettingsDialog.cpp
          git commit -m "Make settings dialog callback const-correct"
          git push origin HEAD:sonar-main-cleanup
